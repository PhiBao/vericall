[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
# The registration ABI is wide enough that some functions need the IR pipeline
# to avoid stack-too-deep; Arc Studio's build uses the same setting.
via_ir = true
gas_reports = ["VeriCallClearinghouse"]
evm_version = "osaka"
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[profile.ci]
fuzz = { runs = 512 }
invariant = { runs = 64, depth = 32, fail_on_revert = true }

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false
int_types = "long"
