<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" role="img"
     aria-labelledby="curveTitle curveDesc" font-family="Inter, system-ui, sans-serif">
  <title id="curveTitle">The settlement curve</title>
  <desc id="curveDesc">A diagram of how a settlement changes with measured latency. Up to the 500 millisecond grace
    latency the covenant pays in full. Between grace and the 2000 millisecond hard timeout a rebate rises linearly
    to the covenant's maximum and returns to the caller. Beyond the hard timeout, or when the response violates the
    schema, the caller is refunded everything and a penalty is taken from the provider's bond.</desc>

  <defs>
    <pattern id="paper2" width="28" height="28" patternUnits="userSpaceOnUse">
      <rect width="28" height="28" fill="#f7f6f2"/>
      <path d="M28 0 L0 0 0 28" fill="none" stroke="#111315" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1040" height="560" fill="url(#paper2)"/>

  <text x="40" y="50" font-size="20" font-weight="600" fill="#111315" font-family="Space Grotesk, Inter, sans-serif"
        letter-spacing="-0.4">A settlement is a function of the measurement, not a negotiation</text>
  <text x="40" y="74" font-size="12.5" fill="#5c636b">
    Covenant: 0.20 USDC · grace 500 ms · hard timeout 2000 ms · max rebate 4000 bps (40%) · penalty 2000 bps (20% of escrow)
  </text>

  <!-- ─────────── plot frame ─────────── -->
  <g transform="translate(96,116)">
    <!-- zone shading -->
    <rect x="0" y="0" width="152" height="300" fill="#059669" fill-opacity="0.07"/>
    <rect x="152" y="0" width="456" height="300" fill="#d97706" fill-opacity="0.08"/>
    <rect x="608" y="0" width="216" height="300" fill="#dc2626" fill-opacity="0.07"/>

    <!-- gridlines -->
    <g stroke="#e2e0d8">
      <line x1="0" y1="300" x2="824" y2="300"/>
      <line x1="0" y1="240" x2="824" y2="240"/>
      <line x1="0" y1="180" x2="824" y2="180"/>
      <line x1="0" y1="120" x2="824" y2="120"/>
      <line x1="0" y1="60"  x2="824" y2="60"/>
    </g>
    <line x1="0" y1="0" x2="0" y2="300" stroke="#cbc8bd"/>

    <!-- zone boundaries -->
    <line x1="152" y1="0" x2="152" y2="300" stroke="#059669" stroke-width="1.4" stroke-dasharray="4 4"/>
    <line x1="608" y1="0" x2="608" y2="300" stroke="#d97706" stroke-width="1.4" stroke-dasharray="4 4"/>

    <!-- y labels: USDC -->
    <g font-size="10.5" font-family="JetBrains Mono, monospace" fill="#8b929a" text-anchor="end">
      <text x="-14" y="304">0.00</text>
      <text x="-14" y="244">0.04</text>
      <text x="-14" y="184">0.08</text>
      <text x="-14" y="124">0.12</text>
      <text x="-14" y="64">0.16</text>
      <text x="-14" y="6">0.20</text>
    </g>
    <text x="-62" y="150" font-size="10.5" fill="#5c636b" transform="rotate(-90,-62,150)"
          text-anchor="middle" letter-spacing="0.5">USDC PER ORDER</text>

    <!-- paid to the provider + dependencies (emerald) -->
    <path d="M0 0 L152 0 L608 180 L608 300 L0 300 Z" fill="#059669" fill-opacity="0.13" stroke="none"/>
    <path d="M0 0 L152 0 L608 180" fill="none" stroke="#059669" stroke-width="2.4"/>

    <!-- rebated to the caller (amber) -->
    <path d="M152 300 L608 120" fill="none" stroke="#d97706" stroke-width="2.4" stroke-dasharray="6 4"/>

    <!-- full refund + slash, beyond the hard timeout -->
    <path d="M608 0 L824 0" fill="none" stroke="#dc2626" stroke-width="2.4"/>
    <path d="M608 300 L608 0" fill="none" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="3 3"/>

    <!-- the worked example: 1250 ms -->
    <line x1="380" y1="0" x2="380" y2="300" stroke="#111315" stroke-width="1" stroke-dasharray="2 3" opacity="0.55"/>
    <circle cx="380" cy="210" r="5.5" fill="#d97706" stroke="#f7f6f2" stroke-width="2"/>
    <circle cx="380" cy="90" r="5.5" fill="#059669" stroke="#f7f6f2" stroke-width="2"/>

    <!-- x ticks -->
    <g font-size="10.5" font-family="JetBrains Mono, monospace" fill="#8b929a" text-anchor="middle">
      <text x="0" y="322">0</text>
      <text x="152" y="322">500</text>
      <text x="380" y="322">1250</text>
      <text x="608" y="322">2000</text>
      <text x="824" y="322">2700</text>
    </g>
    <text x="0" y="342" font-size="10.5" fill="#5c636b">grace</text>
    <text x="608" y="342" font-size="10.5" fill="#5c636b" text-anchor="middle">hard timeout</text>
    <text x="412" y="364" font-size="10.5" fill="#5c636b" text-anchor="middle" letter-spacing="0.5">
      MEASURED LATENCY (ms)
    </text>

    <!-- zone captions -->
    <text x="76" y="26" font-size="11.5" font-weight="600" fill="#059669" text-anchor="middle">PASS</text>
    <text x="380" y="26" font-size="11.5" font-weight="600" fill="#d97706" text-anchor="middle">DEGRADED · LINEAR REBATE</text>
    <text x="716" y="26" font-size="11.5" font-weight="600" fill="#dc2626" text-anchor="middle">BREACH · REFUND + SLASH</text>

    <!-- worked example annotations -->
    <text x="392" y="214" font-size="11" fill="#d97706" font-family="JetBrains Mono, monospace">
      0.035097 rebated to the caller
    </text>
    <text x="392" y="94" font-size="11" fill="#059669" font-family="JetBrains Mono, monospace">
      0.160000 provider · 0.032000 dependency
    </text>
    <text x="392" y="146" font-size="10.5" fill="#8b929a" font-family="JetBrains Mono, monospace">
      at 1250 ms the rebate is 40% × (750/1500) = 20% of the escrow:
    </text>
    <text x="392" y="162" font-size="10.5" fill="#8b929a" font-family="JetBrains Mono, monospace">
      one millisecond more, and it is 0.035097 instead of 0.035000
    </text>
  </g>

  <!-- ─────────── legend ─────────── -->
  <g transform="translate(96,500)">
    <line x1="0" y1="0" x2="26" y2="0" stroke="#059669" stroke-width="2.4"/>
    <text x="34" y="4" font-size="11.5" fill="#111315">paid to the provider and its dependencies</text>

    <line x1="330" y1="0" x2="356" y2="0" stroke="#d97706" stroke-width="2.4" stroke-dasharray="6 4"/>
    <text x="364" y="4" font-size="11.5" fill="#111315">rebated to the caller</text>

    <line x1="560" y1="0" x2="586" y2="0" stroke="#dc2626" stroke-width="2.4"/>
    <text x="594" y="4" font-size="11.5" fill="#111315">refunded to the caller, plus a bond penalty</text>

    <text x="0" y="34" font-size="10.5" fill="#8b929a" font-family="JetBrains Mono, monospace">
      the two curves are complements: every millisecond of overrun moves USDC from one to the other, and no unit is stranded
    </text>
  </g>
</svg>
